[package]
name = "mtkey"
version = "2.0.0"
description = "A cipher workbench: 39 ways to encode, decode, hash and sign"
authors = ["Jericho <jericho@skiddph.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/eru123/mtkey"

[lib]
name = "mtkey"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.2"
