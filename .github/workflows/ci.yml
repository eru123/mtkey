name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check out defuse/php-encryption for cross-language vectors
        uses: actions/checkout@v4
        with:
          repository: defuse/php-encryption
          path: defuse-ref

      - name: Regenerate PHP cross-language test vectors
        run: php tools/gen-vectors.php defuse-ref/src > tests/vectors.json

      - name: Regenerate mcrypt cross-language test vectors (real PHP 5.6)
        run: |
          docker build -q -t mcrypt-php56 -f tools/mcrypt-php56.Dockerfile tools/
          docker run --rm -v "$PWD:/work" -w /work mcrypt-php56             php tools/gen-mcrypt-vectors.php > tests/mcrypt-vectors.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install linux webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check the tauri shell
        run: cargo check
        working-directory: src-tauri
